services:
  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stream
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: twitch_be
    ports:
      - "1200:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/stream
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    volumes:
      - ./images:/app/images
    depends_on:
      - db

  twitch-fe:
    build: /home/marco/react/cinema_fe
    container_name: twitch_fe
    ports:
      - "3000:3000"
    env_file:
      - /home/marco/react/cinema_fe/.env
    environment:
      VITE_API_URL: http://localhost:1200
      API_URL: http://app:8080
    volumes:
      - /home/marco/react/cinema_fe:/app
      - /app/node_modules
    depends_on:
      - app

volumes:
  pgdata:
