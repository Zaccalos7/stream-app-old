server:
  port: 1200

spring:
  application:
    name: stream-app
  web:
    resources:
      static-locations: classpath:/static/

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  logging:
    level:
      root: DEBUG
    file:
      name: logs/twitch.log

  datasource:
    url: jdbc:sqlite:./stream.db
    driver-class-name: org.sqlite.JDBC
    username: zaccalos
    password: zaccalos

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
      database-platform: org.hibernate.community.dialect.SQLiteDialect
      physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  output:
    ansi:
      enabled: always

springdoc:
  api-docs:
    path: /documentazione
    packages-to-scan: com.orbis.stream.controller
    title: "Stream"
    version: "OPENAPI_3_0"
  swagger-ui:
    path: /swagger-ui.html
    locale: it