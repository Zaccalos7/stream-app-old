server:
  port: 1200

spring:
  application:
    name: stream-app
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  logging:
    level:
      root: DEBUG
    file:
      name: logs/twitch.log

  datasource:
    url: jdbc:h2:file:./data/streamdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: zaccalos
    password: zaccalos

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
      physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  output:
    ansi:
      enabled: always

springdoc:
  api-docs:
    path: /documentazione
    packages-to-scan: com.orbis.stream.controller
    title: "Stream"
    version: "OPENAPI_3_0"
  swagger-ui:
    path: /swagger-ui.html
    locale: it